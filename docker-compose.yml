services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ritmo-api
    restart: "no"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://ritmo:ritmo@127.0.0.1:5432/ritmo
      - DIRECT_URL=postgresql://ritmo:ritmo@127.0.0.1:5432/ritmo
    ports:
      - "3000:3000"
      - "3001:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
